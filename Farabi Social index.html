<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M.Farabi - Social Links</title>
  
  <!-- Google Fonts: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    /* Animated Gradient Background */
    body {
      min-height: 100vh;
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      color: #ffffff;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 40px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
    }

    /* Profile Image */
    .profile {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255, 255, 255, 0.8);
      margin-bottom: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.15);
      transition: transform 0.3s ease;
    }

    .profile:hover {
      transform: scale(1.05);
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 5px;
      letter-spacing: 1px;
    }

    .bio {
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 30px;
    }

    /* Social Buttons */
    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      text-decoration: none;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      padding: 16px;
      margin: 15px 0;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }

    .link i {
      position: absolute;
      left: 25px;
      font-size: 22px;
    }

    /* Hover Effects */
    .link:hover {
      transform: translateY(-4px);
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .footer {
      margin-top: 35px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="container">
    
    <!-- Profile Picture: Change the src link to your actual image link later -->
    <img class="profile" src="https://i.pravatar.cc/300" alt="M.Farabi">
    
    <h1>M.Farabi</h1>
    <p class="bio">Welcome to my official links</p>

    <!-- Facebook -->
    <a class="link" href="https://www.facebook.com/fake.farabi" target="_blank">
      <i class="fab fa-facebook"></i> Facebook
    </a>

    <!-- Instagram -->
    <a class="link" href="https://www.instagram.com/fake_farabi/" target="_blank">
      <i class="fab fa-instagram"></i> Instagram
    </a>

    <!-- TikTok -->
    <a class="link" href="https://www.tiktok.com/@fake_farabi" target="_blank">
      <i class="fab fa-tiktok"></i> TikTok
    </a>

    <!-- YouTube -->
    <a class="link" href="https://www.youtube.com/@fake_farabi" target="_blank">
      <i class="fab fa-youtube"></i> YouTube
    </a>

    <div class="footer">
      © 2026 M.Farabi
    </div>

  </div>

</body>
</html>
